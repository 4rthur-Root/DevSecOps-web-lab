# ============================================================================
# ModSecurity Exclusion Rules — False Positive Tuning
# Deployed via Ansible (waf-setup.yml → Included in setup.conf)
# ============================================================================
#
# Context: The OWASP CRS WAF is blocking certain legitimate requests from the
# Juice Shop application. These exclusions adjust CRS rules to allow legitimate
# traffic without disabling overall protection.
#
# Format: SecRuleUpdateTargetById removes a target (ARG, URI, etc.) from an
# existing CRS rule at configuration load time. This is the recommended approach
# (vs ctl:ruleRemoveTargetById) as it works regardless of the file inclusion order.
# ============================================================================

# --------------------------------------------------------------------------
# FP-001: Product searches containing "../"
# --------------------------------------------------------------------------
# CRS Rule: 930110 (Path Traversal Attack)
# Request:  GET /rest/products/search?q=../juice
# Reason:   The "q" parameter in product search can legitimately contain "../"
#           (product name, description). Rule 930110 detects this pattern as
#           an LFI attempt.
# Fix:      Remove ARGS:q from rule 930110 targets.
#           LFI protection remains active on all other parameters and endpoints
#           (e.g., /.git/config → still 403).
# --------------------------------------------------------------------------
SecRuleUpdateTargetById 930110 "!ARGS:q"

# --------------------------------------------------------------------------
# Expected Result After Deployment:
#   $ curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/rest/products/search?q=../juice"
#   → 200 (fixed)
#   $ curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/.git/config"
#   → 403 (still protected)
#   $ curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/rest/products/search?q=test%27%20OR%20%271%27=%271"
#   → 403 (still protected)
# --------------------------------------------------------------------------