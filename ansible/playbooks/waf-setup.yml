---
# This file deploys nginx.conf,
# activates the block in ModSecurity (SecRuleEngine On), c
# configures the default action of CRS in reject (SecDefaultAction deny:403), 
# injects the exclusion rules of the false positives,
# replaces the symbolic links of logs by true files.

- name: Configurations of WAF (Nginx + ModSecurity + Logs JSON)
  hosts: waf
  gather_facts: true

  tasks:

    - name: "WAF | Create the conf Nginx custom repertoire"
      file:
        path: /etc/nginx/conf.d
        state: directory
        mode: '0755'

    - name: "WAF | Deploy the Nginx config (reverse proxy + logs JSON)"
      copy:
        src: ../files/waf/nginx.conf
        dest: /etc/nginx/conf.d/default.conf
        mode: '0644'
      notify: Reload Nginx

    - name: "WAF | Replace Nginx log symlinks with real files (for Alloy collection)"
      shell: |
        if [ -L /var/log/nginx/access.log ]; then rm /var/log/nginx/access.log && touch /var/log/nginx/access.log; fi
        if [ -L /var/log/nginx/error.log ]; then rm /var/log/nginx/error.log && touch /var/log/nginx/error.log; fi
        chown nginx:adm /var/log/nginx/access.log /var/log/nginx/error.log
      changed_when: false

    - name: "WAF | Activate ModSecurity en block mode"
      lineinfile:
        path: /etc/modsecurity.d/modsecurity.conf
        regexp: '^SecRuleEngine'
        line: 'SecRuleEngine On'
        backup: yes
      notify: Reload Nginx

    - name: "WAF | Forcer le blocage (deny 403) dans les actions par défaut du CRS"
      lineinfile:
        path: /etc/modsecurity.d/owasp-crs/crs-setup.conf
        regexp: '^SecDefaultAction'
        line: 'SecDefaultAction "phase:{{ item }},log,deny,status:403,tag:''modsecurity''"'
        backup: yes
      loop:
        - "1"
        - "2"
      notify: Reload Nginx

    - name: "WAF | Deploy the exception rules (anti false positives)"
      copy:
        src: ../files/waf/exclusion_rules.conf
        dest: /etc/modsecurity.d/exclusion_rules.conf
        mode: '0644'
      notify: Reload Nginx

    - name: "WAF | Include the exception rules in setup.conf"
      lineinfile:
        path: /etc/modsecurity.d/setup.conf
        line: 'Include /etc/modsecurity.d/exclusion_rules.conf'
        state: present
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      command: nginx -s reload
