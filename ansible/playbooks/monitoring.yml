---
# Monitoring Pipeline Verification Playbook
# Verifies that WAF writes JSON logs to /var/log/nginx/access.log,
# generates test traffic, and ensures Loki is accessible.
- name: "Monitoring | Verification pipeline Alloy → Loki"
  hosts: waf
  gather_facts: false

  tasks:

    - name: "MON | Verify logs file is accessible and not empty"
      stat:
        path: /var/log/nginx/access.log
      register: log_file

    - name: "MON | Résultat vérification log"
      debug:
        msg: >
          Log WAF : {{ 'EXISTS' if log_file.stat.exists else 'MISSING' }} |
          Taille : {{ log_file.stat.size | default(0) }} bytes

    - name: "MON | Générer une entrée de log test"
      uri:
        url: "http://localhost:8080/rest/products/search?q=monitoring-test"
        method: GET
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: "MON | Read the last 3 lines of the logs (JSON verification)"
      command: tail -3 /var/log/nginx/access.log
      register: last_logs
      changed_when: false

    - name: "MON | Shows the last logs"
      debug:
        var: last_logs.stdout_lines

    - name: "MON | Verifiy Loki is accessible from the WAF"
      uri:
        url: "http://loki:3100/ready"
        method: GET
      register: loki_health
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: "MON | Loki Statut"
      debug:
        msg: "Loki status : {{ loki_health.status | default('UNREACHABLE') }}"
